{% include base_path %}

<!-- start custom head snippets -->

<!-- Academic typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Noto+Serif+SC:wght@400;500;600&amp;family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap"
>

<!-- Support for Academicons -->
<link
  rel="preload"
  href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'"
>
<noscript>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
  >
</noscript>

<!-- Support for Font Awesome -->
<link
  rel="preload"
  href="{{ base_path }}/assets/css/fontawesome.css"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'"
>
<noscript>
  <link
    rel="stylesheet"
    href="{{ base_path }}/assets/css/fontawesome.css"
  >
</noscript>

<!-- Favicons -->
<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="{{ base_path }}/images/apple-touch-icon-180x180.png"
>

<link
  rel="icon"
  type="image/svg+xml"
  href="{{ base_path }}/images/favicon.svg"
>

<link
  rel="icon"
  type="image/png"
  sizes="32x32"
  href="{{ base_path }}/images/favicon-32x32.png"
>

<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="{{ base_path }}/images/favicon-192x192.png"
>

<link
  rel="manifest"
  href="{{ base_path }}/images/manifest.json"
>

<link
  rel="icon"
  href="{{ base_path }}/images/favicon.ico"
>

<meta
  name="theme-color"
  content="#faf8f4"
  media="(prefers-color-scheme: light)"
>

<meta
  name="theme-color"
  content="#202326"
  media="(prefers-color-scheme: dark)"
>

<!-- end custom head snippets -->
