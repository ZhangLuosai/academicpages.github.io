name: Build CV PDFs

on:
  push:
    branches:
      - cv-pdf-links
    paths:
      - '_cv_upload/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upload chunks
        id: check
        shell: bash
        run: |
          set -e
          en_count=$(find _cv_upload -maxdepth 1 -type f -name 'en_*.b64' 2>/dev/null | wc -l)
          cn_count=$(find _cv_upload -maxdepth 1 -type f -name 'cn_*.b64' 2>/dev/null | wc -l)
          if [ "$en_count" -eq 5 ] && [ "$cn_count" -eq 12 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode CV PDFs
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          mkdir -p files
          cat _cv_upload/en_*.b64 | tr -d '\n\r' | base64 --decode > files/Luosai_Zhang_CV_EN.pdf
          cat _cv_upload/cn_*.b64 | tr -d '\n\r' | base64 --decode > files/Luosai_Zhang_CV_CN.pdf
          rm -rf _cv_upload

      - name: Commit generated PDFs
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A files _cv_upload
          git diff --cached --quiet && exit 0
          git commit -m "Add CV PDFs"
          git push
