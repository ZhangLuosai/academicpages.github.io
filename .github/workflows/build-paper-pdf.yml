name: Build paper PDF

on:
  push:
    branches:
      - paper-pdf-link
    paths:
      - '_paper_upload/**'
      - '.github/workflows/build-paper-pdf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upload chunks
        id: check
        shell: bash
        run: |
          set -e
          count=$(find _paper_upload -maxdepth 1 -type f -name 'properness_*.b64' 2>/dev/null | wc -l)
          if [ "$count" -eq 5 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode paper PDF
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          mkdir -p files
          cat _paper_upload/properness_*.b64 | tr -d '\n\r' | base64 --decode > files/Zhang_2025_Properness_Weak_Stability.pdf
          rm -rf _paper_upload
          rm -f .github/workflows/build-paper-pdf.yml

      - name: Commit generated PDF
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A files _paper_upload .github/workflows/build-paper-pdf.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add Properness paper PDF"
          git push
